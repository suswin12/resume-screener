<!doctype html>
<html>
  <head>
    <title>Signup - Resume Screener</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #16a34a, #0891b2);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .signup-card {
        width: 420px;
        border-radius: 16px;
        border: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      .signup-header {
        background: linear-gradient(135deg, #16a34a, #0891b2);
        padding: 30px;
        text-align: center;
        color: white;
      }
      .signup-header .logo {
        font-size: 2.5rem;
        margin-bottom: 8px;
      }
      .signup-header h4 {
        font-weight: 700;
        margin: 0;
      }
      .signup-header p {
        opacity: 0.8;
        font-size: 0.85rem;
        margin: 5px 0 0;
      }
      .signup-body {
        padding: 30px;
      }
      .form-label {
        font-weight: 600;
        font-size: 0.875rem;
        color: #374151;
      }
      .form-control {
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.9rem;
      }
      .form-control:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
      }
      .input-group-text {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        color: #64748b;
      }
      .btn-signup {
        background: linear-gradient(135deg, #16a34a, #0891b2);
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
        transition: opacity 0.2s;
      }
      .btn-signup:hover {
        opacity: 0.9;
      }
      .login-link {
        color: #16a34a;
        font-weight: 600;
        text-decoration: none;
      }
      .login-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card signup-card">
      <!-- Header -->
      <div class="signup-header">
        <div class="logo"></div>
        <h4>Create Account</h4>
        <p>Join the Resume Screening System</p>
      </div>

      <!-- Body -->
      <div class="signup-body">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for cat, msg in messages %}
        <div
          class="alert alert-{{ 'danger' if cat=='danger' else 'success' }} alert-dismissible fade show mb-3"
          role="alert"
          style="font-size: 0.85rem; border-radius: 8px"
        >
          <i
            class="fas fa-{{ 'exclamation-circle' if cat=='danger' else 'check-circle' }} me-2"
          ></i
          >{{ msg }}
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
          ></button>
        </div>
        {% endfor %} {% endif %} {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter your full name"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fas fa-envelope"></i
              ></span>
              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create a password"
                required
              />
            </div>
          </div>

          <button class="btn btn-success btn-signup w-100 text-white">
            <i class="fas fa-user-plus me-2"></i>Create Account
          </button>
        </form>

        <div class="text-center mt-4">
          <small style="color: #64748b">
            Already have an account?
            <a href="{{ url_for('login') }}" class="login-link">Login</a>
          </small>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
