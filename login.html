<!doctype html>
<html>
  <head>
    <title>Login - Resume Screener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 400px;
        border-radius: 16px;
        border: none;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
      }
      .login-header {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        padding: 30px;
        text-align: center;
        color: white;
      }
      .login-header .logo { font-size: 2.5rem; margin-bottom: 8px; }
      .login-header h4 { font-weight: 700; margin: 0; }
      .login-header p { opacity: 0.8; font-size: 0.85rem; margin: 5px 0 0; }
      .login-body { padding: 30px; }
      .form-label { font-weight: 600; font-size: 0.875rem; color: #374151; }
      .form-control {
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.9rem;
      }
      .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      }
      .input-group-text {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        color: #64748b;
      }
      .btn-login {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
        transition: opacity 0.2s;
      }
      .btn-login:hover { opacity: 0.9; }
      .signup-link { color: #2563eb; font-weight: 600; text-decoration: none; }
      .signup-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card login-card">
      <!-- Header -->
      <div class="login-header">
        <h4>Welcome Back</h4>
        <p>Login to Resume Screening System</p>
      </div>

      <!-- Body -->
      <div class="login-body">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ 'danger' if cat=='danger' else 'success' }} alert-dismissible fade show mb-3" role="alert" style="font-size:0.85rem; border-radius:8px;">
              <i class="fas fa-{{ 'exclamation-circle' if cat=='danger' else 'check-circle' }} me-2"></i>{{ msg }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="Enter your email" required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter your password" required />
            </div>
          </div>

          <button class="btn btn-primary btn-login w-100 text-white">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>

        <div class="text-center mt-4">
          <small style="color:#64748b;">
            Don't have an account?
            <a href="{{ url_for('signup') }}" class="signup-link">Sign Up</a>
          </small>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
